x; flex-direction: column; gap: 12px;"><span><b style="font-family: 'LH Header', sans-serif; font-size: 24px;">ศรีเจริญวัสดุ (นามสมมติ)</b><br><span style="font-size: 16px; color: #5A6662;">ผู้ค้าส่งวัสดุก่อสร้าง · นครราชสีมา</span></span><p style="margin: 0; font-size: 18px; color: #1F2224;">“ขยายคลังสินค้าแห่งที่สองเพื่อรับงานผู้รับเหมาในจังหวัดใกล้เคียง”</p><div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #E0F4F1;"><b style="font-family: 'LH Header', sans-serif; font-size: 34px; color: #00756B;">2 เท่า</b><span style="font-size: 16px; color: #3D4845;">พื้นที่คลังสินค้า</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="font-size: 15px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">Construction Material Loan</span><span style="font-size: 15px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">หนังสือค้ำประกัน</span></div></div></article></div>

="width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;"><span style="position: absolute; top: 12px; left: 12px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(31,34,36,0.72); border-radius: 999px; padding: 3px 10px;">MOCKUP · ตัวอย่างเนื้อหา</span></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;"><span><b style="font-family: 'LH Header', sans-serif; font-size: 22px;">สวนผลไม้ทองดี (นามสมมติ)</b><br><span style="font-size: 15px; color: #5A6662;">ผู้ส่งออกผลไม้แปรรูป · จันทบุรี</span></span><p style="margin: 0; font-size: 17px; color: #1F2224;">“ส่งออกครั้งแรกไปไต้หวัน ทีม Export x Import Hub ช่วยวางขั้นตอนการชำระเงินกับคู่ค้า”</p><div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #E0F4F1;"><b style="font-family: 'LH Header', sans-serif; font-size: 32px; color: #00756B;">3 ประเทศ</b><span style="font-size: 15px; color: #3D4845;">ตลาดส่งออกใน 1 ปี</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="font-size: 14px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">การค้าระหว่างประเทศ</span><span style="font-size: 14px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">Export x Import Hub</span></div></div></article><article style="border: 1px solid #E2EAE8; border-radius: 24px; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column;"><div style="position: relative;"><img src="assets/img/01e14e5e8e00b3605118441aabb4d777.jpg" alt="ผู้ค้าส่งวัสดุก่อสร้าง · นครราชสีมา" style="width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;"><span style="position: absolute; top: 12px; left: 12px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(31,34,36,0.72); border-radius: 999px; padding: 3px 10px;">MOCKUP · ตัวอย่างเนื้อหา</span></div><div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;"><span><b style="font-family: 'LH Header', sans-serif; font-size: 22px;">ศรีเจริญวัสดุ (นามสมมติ)</b><br><span style="font-size: 15px; color: #5A6662;">ผู้ค้าส่งวัสดุก่อสร้าง · นครราชสีมา</span></span><p style="margin: 0; font-size: 17px; color: #1F2224;">“ขยายคลังสินค้าแห่งที่สองเพื่อรับงานผู้รับเหมาในจังหวัดใกล้เคียง”</p><div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #E0F4F1;"><b style="font-family: 'LH Header', sans-serif; font-size: 32px; color: #00756B;">2 เท่า</b><span style="font-size: 15px; color: #3D4845;">พื้นที่คลังสินค้า</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="font-size: 14px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">Construction Material Loan</span><span style="font-size: 14px; border: 1px solid #C5D6D2; border-radius: 999px; padding: 3px 10px; color: #3D4845;">หนังสือค้ำประกัน</span></div></div></article></div>
