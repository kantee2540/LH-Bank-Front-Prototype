<section id="rf-calc" aria-labelledby="rfm-calc-h" style="padding: 20px 16px 20px 16px; margin: 0 0 0 0;">

        <div><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 19px;"><label for="{{sl.id}}-m" style="color: #3D4845;">{{sl.label}}</label><b style="font-family: 'LH Header', sans-serif; font-size: 23px;">{{sl.txt}}</b></div><input id="{{sl.id}}-m" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.val}}" onChange="{{sl.set}}" style="width: 100%; accent-color: #00756B; margin-top: 6px;"><div style="display: flex; justify-content: space-between; font-size: 16px; color: #5A6662;"><span>{{sl.minTxt}}</span><span>{{sl.maxTxt}}</span></div></div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 19px; color: #3D4845;">แผนดอกเบี้ย LH Bank</span>
        <div role="radiogroup" aria-label="เลือกแผนดอกเบี้ย" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <sc-for list="{{plans}}" as="pl" hint-placeholder-count="4"><button role="radio" aria-checked="{{pl.sel}}" onClick="{{pl.pick}}" style="{{pl.style}} padding: 10px 12px;"><b style="font-size: 18px;">{{pl.ins}}</b><span style="font-size: 16px; color: #5A6662;">{{pl.reg}}</span></button></sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 19px; color: #3D4845;">ค่าปรับปิดบัญชีธนาคารเดิม</span>
        <div style="display: flex; gap: 8px;"><sc-for list="{{pens}}" as="pn" hint-placeholder-count="3"><button aria-pressed="{{pn.sel}}" onClick="{{pn.pick}}" style="cursor: pointer; {{pn.style}} font-size: 18px;">{{pn.label}}</button></sc-for></div>
      </div>
    </div>
    <div aria-live="polite" style="background: linear-gradient(160deg, #2F5C66 0%, #1D3F47 100%); color: #FFFFFF; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 18px; color: #C5D6D2;">ผ่อนน้อยลงประมาณ</span>
      <b style="font-family: 'LH Header', sans-serif; font-size: 48px; line-height: 1.05; color: #02FECF;">{{calc.save}} <span style="font-size: 20px; font-weight: 400; color: #FFFFFF;">บาท/เดือน</span></b>
      <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 18px;"><span style="color: #C5D6D2;">ค่างวดเดิม → ใหม่</span><b>{{calc.oldPay}} → {{calc.newPay}}</b></div>
      <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px;">
