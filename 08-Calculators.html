<main id="main">

<div style="background: #FFFFFF; border-bottom: 1px solid #E2EAE8;">

</div>

<!-- 1 Wizard -->
<section id="tw" aria-labelledby="tw-h1" style="background: linear-gradient(180deg, #F3F8F7 0%, #FFFFFF 70%);">
  <div style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 56px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; margin-bottom: 28px;">
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px;">
        <span style="align-self: flex-start; font-size: 16px; font-weight: 700; color: #1D3F47; background: #E6EFF1; border-radius: 999px; padding: 6px 14px;">เครื่องมือคำนวณ</span>
        <h1 id="tw-h1" style="margin: 0; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 52px; line-height: 1.12; color: #1F2224;">อยากรู้ตัวเลขเรื่องไหน<br><b style="font-weight: 700; color: #2F5C66;">ตอบ 3 ข้อ ก็รู้ผลทันที</b></h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3D4845;">เลือกเรื่อง ตอบคำถามด้วยการกดเลือก ไม่ต้องพิมพ์ตัวเลข แล้วให้เจ้าหน้าที่ช่วยวางแผนต่อได้</p>
      </div>
      <ol aria-label="ขั้นตอน" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; min-width: 520px;">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
          <li style="display: contents;"><span style="display: flex; gap: 8px; align-items: center;"><span style="{{st.dot}}">{{st.n}}</span><span style="{{st.txt}}">{{st.label}}</span></span><span aria-hidden="true" style="{{st.line}}"></span></li>
        </sc-for>
      </ol>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2EAE8; border-radius: 20px; box-shadow: 0 24px 56px rgba(0,40,36,0.08); overflow: hidden;">

      <!-- step 1: topic -->
      <sc-if value="{{onPick}}" hint-placeholder-val="{{true}}">
        <div style="padding: 36px 40px 40px;">
          <h2 style="margin: 0 0 6px; font-family: 'LH Header', sans-serif; font-size: 46px; font-weight: 200;">1. อยากรู้<b style="font-weight: 700;">เรื่องอะไร</b></h2>
          <p style="margin: 0 0 22px; font-size: 18px; color: #5A6662;">แตะเลือก 1 เรื่อง</p>
          <div role="radiogroup" aria-label="เรื่องที่อยากรู้" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
            <sc-for list="{{topics}}" as="o" hint-placeholder-count="6">
              <button role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">
                <span style="width: 52px; height: 52px; border-radius: 20px; background: #E6EFF1; color: #2F5C66; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="{{o.d}}" style="fill: currentColor; stroke: none;"></path></svg></span>
                <b style="font-family: 'LH Header', sans-serif; font-size: 24px; line-height: 1.25;">{{o.t}}</b>
                <span style="font-size: 17px; color: #3D4845;">{{o.s}}</span>
                <span style="margin-top: 4px; font-size: 16px; font-weight: 700; color: #2F5C66;">เลือก →</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- step 2/3 shell: left content, right result -->
      <sc-if value="{{onCalc}}" hint-placeholder-val="{{false}}">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 460px;">
          <div style="padding: 32px 40px 36px; display: flex; flex-direction: column; gap: 22px;">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
              <span style="display: inline-flex; gap: 10px; align-items: center; font-size: 17px; font-weight: 700; color: #1D3F47; background: #E6EFF1; border-radius: 999px; padding: 6px 14px 6px 8px;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #FFFFFF; color: #2F5C66; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{tp.d}}" style="fill: currentColor; stroke: none;"></path></svg></span>{{tp.t}}</span>
              <button onClick="{{back}}" style="cursor: pointer; border: 0; background: transparent; font-family: inherit; font-size: 16px; font-weight: 700; color: #5A6662;">← ย้อนกลับ</button>
            </div>

            <sc-if value="{{onAsk}}" hint-placeholder-val="{{false}}">
              <h2 style="margin: 0; font-family: 'LH Header', sans-serif; font-size: 46px; font-weight: 200;">2. <b style="font-weight: 700;">{{tp.s}}</b></h2>
              <sc-for list="{{sliders}}" as="sl" hint-placeholder-count="2">
                <div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px;"><label for="{{sl.id}}" style="color: #3D4845;">{{sl.label}}</label><b style="font-family: 'LH Header', sans-serif; font-size: 24px; white-space: nowrap;">{{sl.txt}}</b></div><input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.val}}" onChange="{{sl.set}}" style="width: 100%; accent-color: #2F5C66; margin-top: 8px;"><div style="display: flex; justify-content: space-between; font-size: 14px; color: #5A6662;"><span>{{sl.minTxt}}</span><span>{{sl.maxTxt}}</span></div></div>
              </sc-for>
              <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
                  <sc-if value="{{c.head}}" hint-placeholder-val="{{false}}"><span style="flex-basis: 100%; font-size: 18px; color: #3D4845; margin-top: 6px;">{{c.label}}</span></sc-if>
                  <sc-if value="{{c.pill}}" hint-placeholder-val="{{true}}"><button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-if>
                </sc-for>
              </div>
              <button onClick="{{next}}" style="cursor: pointer; align-self: flex-start; margin-top: 6px; border: 0; border-radius: 999px; padding: 15px 30px; font-size: 18px; font-weight: 700; font-family: inherit; background: #3AA3CE; color: #FFFFFF;">ถัดไป: รับผลและให้เราช่วยวางแผน →</button>
            </sc-if>

            <sc-if value="{{onLead}}" hint-placeholder-val="{{false}}">
              <h2 style="margin: 0; font-family: 'LH Header', sans-serif; font-size: 46px; font-weight: 200;">3. ให้เจ้าหน้าที่<b style="font-weight: 700;">ติดต่อกลับ</b></h2>
              <p style="margin: -10px 0 0; font-size: 17px; color: #5A6662;">ผลคำนวณด้านขวาจะแนบไปกับคำขอ เจ้าหน้าที่ไม่ต้องถามซ้ำ</p>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; color: #3D4845;">ชื่อ<input type="text" value="{{name}}" onInput="{{setName}}" placeholder="ชื่อเล่นก็ได้" style="border: 1.5px solid #D8E4E1; border-radius: 12px; padding: 13px 14px; font-size: 18px; font-family: inherit;"></label>
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; color: #3D4845;">เบอร์มือถือ<input type="tel" inputmode="numeric" value="{{phone}}" onInput="{{setPhone}}" placeholder="08x-xxx-xxxx" style="border: 1.5px solid #D8E4E1; border-radius: 12px; padding: 13px 14px; font-size: 18px; font-family: inherit;"></label>
              </div>
              <sc-if value="{{phoneErr}}" hint-placeholder-val="{{false}}"><span style="margin-top: -12px; font-size: 15px; color: #B5471B;">กรอกเบอร์มือถือ 10 หลัก ขึ้นต้นด้วย 0</span></sc-if>
              <div style="display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px;">
                <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 16px; color: #3D4845;">เวลาที่สะดวก</span><div style="display: flex; gap: 8px;"><sc-for list="{{times}}" as="o" hint-placeholder-count="3"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
                <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 16px; color: #3D4845;">ติดต่อทาง</span><div style="display: flex; gap: 8px;"><sc-for list="{{chs}}" as="o" hint-placeholder-count="2"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
              </div>
              <button role="checkbox" aria-checked="{{consent}}" onClick="{{toggleConsent}}" style="cursor: pointer; border: 0; background: transparent; padding: 0; font-family: inherit; text-align: left; display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.5; color: #3D4845;"><span style="{{box}}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M22.32 4.399999999999999 8.48 18.240000000000002Q8.24 18.56 7.800000000000001 18.56Q7.36 18.56 7.12 18.240000000000002L1.76 12.879999999999999Q1.44 12.64 1.04 12.64Q0.64 12.64 0.32 12.879999999999999Q0.0 13.2 0.0 13.6Q0.0 14.0 0.32 14.32L5.68 19.68Q6.5600000000000005 20.56 7.800000000000001 20.56Q9.040000000000001 20.56 9.92 19.68L23.76 5.84Q24.0 5.52 24.0 5.119999999999999Q24.0 4.719999999999999 23.76 4.399999999999999Q23.44 4.16 23.04 4.16Q22.64 4.16 22.32 4.399999999999999Z" style="fill: currentColor; stroke: none;"></path></svg></span><span>ยินยอมให้ธนาคารแลนด์ แอนด์ เฮ้าส์ ติดต่อกลับเพื่อเสนอผลิตภัณฑ์ที่เกี่ยวข้อง ตาม<u>ประกาศความเป็นส่วนตัว</u> ถอนความยินยอมได้ทุกเมื่อ</span></button>
              <button onClick="{{submit}}" style="{{sendBtn}}">ส่งข้อมูลให้เจ้าหน้าที่ติดต่อกลับ</button>
            </sc-if>
          </div>

          <aside aria-live="polite" style="background: linear-gradient(160deg, #2F5C66 0%, #1D3F47 100%); color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; gap: 14px;">
            <span style="font-size: 17px; color: #C5D6D2;">{{res.label}}</span>
            <b style="font-family: 'LH Header', sans-serif; font-size: 50px; line-height: 1.1; color: #02FECF;">{{res.main}}</b>
            <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 14px;">
              <sc-for list="{{res.subs}}" as="r" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 17px;"><span style="color: #C5D6D2;">{{r.l}}</span><b style="text-align: right;">{{r.v}}</b></div></sc-for>
