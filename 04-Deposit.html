<!-- 3 Accounts by goal -->

    <h2 id="dp-acc-h" style="margin: 0; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 44px; line-height: 1.15;">เงินแบบไหน ก็มี<b style="font-weight: 700;">บัญชีที่ใช่</b></h2>
    <div role="group" aria-label="กรองตามเป้าหมาย" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{goalPills}}" as="g" hint-placeholder-count="5"><button aria-pressed="{{g.sel}}" onClick="{{g.pick}}" style="cursor: pointer; {{g.style}}">{{g.label}}</button></sc-for>

<!-- 4 Calculator -->
<section id="dp-calc" aria-labelledby="dp-calc-h" style="max-width: 1280px; margin: 0 auto 0 auto; padding: 36px 32px 36px 32px;">
  <h2 id="dp-calc-h" style="margin: 0 0 8px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 44px; line-height: 1.15;">รู้ดอกเบี้ย<b style="font-weight: 700;">ก่อนเปิดบัญชี</b></h2>
  <p style="margin: 0 0 24px; font-size: 19px; color: #3D4845;">คำนวณจากอัตราดอกเบี้ยที่ประกาศจริงของแต่ละบัญชี</p>
  <div role="tablist" aria-label="เลือกเครื่องคำนวณ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #EAF5F7; border-radius: 20px; padding: 6px; margin-bottom: 16px;">
    <sc-for list="{{calcTabs}}" as="ct" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{ct.sel}}" aria-controls="dp-calc-panel" onClick="{{ct.pick}}" style="cursor: pointer; {{ct.style}}"><span style="{{ct.icBox}}"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="{{ct.d}}" style="fill: currentColor; stroke: none;"></path></svg></span><span>{{ct.label}}</span></button>
    </sc-for>
  </div>
  <div id="dp-calc-panel" style="border: 1px solid #D8E4E1; border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 440px; box-shadow: 0 16px 40px rgba(30,80,100,0.08);">
    <div role="tabpanel" style="padding: 36px 40px; display: flex; flex-direction: column; gap: 20px;">
      <b style="font-family: 'LH Header', sans-serif; font-size: 28px;">{{k.title}}</b>
      <sc-if value="{{k.hasPick}}" hint-placeholder-val="{{true}}">
        <div><span style="font-size: 17px; color: #5A6662;">{{k.pickLabel}}</span><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"><sc-for list="{{k.picks}}" as="o" hint-placeholder-count="3"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}}">{{o.label}}</button></sc-for></div></div>
      </sc-if>
      <sc-for list="{{k.sliders}}" as="sl" hint-placeholder-count="2">
        <div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px;"><label for="{{sl.id}}" style="color: #3D4845;">{{sl.label}}</label><b style="font-family: 'LH Header', sans-serif; font-size: 22px;">{{sl.txt}}</b></div><input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.val}}" onChange="{{sl.set}}" style="width: 100%; accent-color: #2E6A80; margin-top: 6px;"><div style="display: flex; justify-content: space-between; font-size: 14px; color: #5A6662;"><span>{{sl.minTxt}}</span><span>{{sl.maxTxt}}</span></div></div>
      </sc-for>
      <span style="font-size: 15px; color: #5A6662;">{{k.note}}</span>
    </div>
    <div aria-live="polite" style="background: linear-gradient(155deg, #2B6479 0%, #3F7F97 50%, #5A99B0 100%); color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; gap: 16px;">
      <span style="font-size: 17px; color: rgba(255,255,255,0.9);">{{k.mainLabel}}</span>
      <b style="font-family: 'LH Header', sans-serif; font-size: 52px; line-height: 1.1; color: #FFFFFF;">{{k.main}}</b>
      <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 14px;">
        <sc-for list="{{k.subs}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 17px;"><span style="color: rgba(255,255,255,0.9);">{{r.label}}</span><b>{{r.val}}</b></div>
        </sc-for>
      </div>
      <div>
        <span style="font-size: 15px; color: rgba(255,255,255,0.9);">เงินต้นกับดอกเบี้ยเมื่อครบกำหนด</span>
        <div aria-hidden="true" style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 8px; background: rgba(255,255,255,0.2);"><span style="{{k.barP}}"></span><span style="{{k.barI}}"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; margin-top: 6px;"><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: rgba(255,255,255,0.6); margin-right: 6px;"></span>เงินต้น {{k.pTxt}}</span><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #FBAC22; margin-right: 6px;"></span>ดอกเบี้ย {{k.iTxt}}</span></div>
      </div>
      <a href="#dp-app" style="margin-top: auto; background: #FFFFFF; color: #24586C; border-radius: 999px; padding: 14px; text-align: center; font-weight: 700; text-decoration: none;">{{k.cta}}</a>
    </div>
  </div>
</section>

              <div role="row" style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 3fr); background: #EAF5F7; font-size: 15px; font-weight: 700; color: #3D4845;"><span role="columnheader" style="padding: 12px 16px;">บัญชี</span><span role="columnheader" style="padding: 12px 16px;">ดอกเบี้ย (% ต่อปี)</span><span role="columnheader" style="padding: 12px 16px;">เงื่อนไข</span></div>

<!-- 2 Accounts carousel -->
<section id="dp-accounts" aria-labelledby="dpm-acc-h" style="padding: 40px 0 20px 0; margin: 0 0 0 0;">

  <div style="display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 12px; scroll-snap-type: x mandatory; scroll-padding: 0 16px;">

<!-- 3 Calculator -->

  <div role="tablist" aria-label="เลือกเครื่องคำนวณ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #EAF5F7; border-radius: 20px; padding: 6px; margin-bottom: 12px;">

      <button role="tab" aria-selected="{{ct.sel}}" onClick="{{ct.pick}}" style="cursor: pointer; {{ct.style}} flex-direction: column; align-items: flex-start; font-size: 17px; padding: 10px; gap: 6px;"><span style="{{ct.icBox}} width: 32px; height: 32px; border-radius: 12px;"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{ct.d}}" style="fill: currentColor; stroke: none;"></path></svg></span><span>{{ct.label}}</span></button>
    </sc-for>
  </div>
  <div style="border: 1px solid #D8E4E1; border-radius: 20px; overflow: hidden;">

  </div>
</section>

        </sc-if>
      </div>
    </sc-for>
  </div>
