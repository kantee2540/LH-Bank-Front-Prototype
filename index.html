<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลือกหน้า | LH Bank 2027 – Prototype</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#F4F7F6;color:#1F2A28;font-family:'LH Body','Noto Sans Thai',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #FFCD00;outline-offset:3px;border-radius:16px}
.wrap{max-width:1120px;margin:0 auto;padding:48px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px}
header img{height:40px;width:auto;display:block}
.tag{font-size:13px;color:#00756B;background:#E3F1EF;padding:6px 12px;border-radius:999px}
h1{font-family:'LH Header',sans-serif;font-size:clamp(28px,4vw,40px);margin:0 0 8px;color:#00756B}
p.lead{margin:0 0 32px;color:#5A6966;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:#FFF;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,117,107,.16)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#E3F1EF}
.body{padding:16px 20px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-size:12px;color:#8A9895;letter-spacing:.04em}
.name{font-family:'LH Header',sans-serif;font-size:20px;margin-top:2px}
.file{font-size:12px;color:#8A9895;margin-top:4px}
.arrow{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#FFCD00;display:grid;place-items:center;color:#1F2A28}
.card:hover .arrow{background:#00756B;color:#FFF}
.arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/img/887a1b7f9e239e435b28a71c83b7e51c.svg" alt="LH Bank">
    <span class="tag">Prototype 2027</span>
  </header>

  <h1>เลือกหน้าที่ต้องการดู</h1>
  <p class="lead">Select a page to view</p>

  <nav class="grid">
    <a class="card" href="01-Home.html">
      <img src="assets/img/d7a9edfb422a532cbf4f3928127666ca.jpg" alt="">
      <div class="body">
        <div><div class="num">01</div><div class="name">หน้าแรก</div><div class="file">Home</div></div>
        <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
    </a>
    <a class="card" href="02-Personal.html">
      <img src="assets/img/0f361559d9312af12988ff76e22d515d.jpg" alt="">
      <div class="body">
        <div><div class="num">02</div><div class="name">ลูกค้าบุคคล</div><div class="file">Personal</div></div>
        <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
    </a>
    <a class="card" href="03-SME.html">
      <img src="assets/img/c14864205db8e2bf638a93dc718d0fe4.jpg" alt="">
      <div class="body">
        <div><div class="num">03</div><div class="name">ลูกค้า SME</div><div class="file">SME</div></div>
        <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
    </a>
    <a class="card" href="04-Business.html">
      <img src="assets/img/ea393ebb98e89cbe57b409975ef6c050.jpg" alt="">
      <div class="body">
        <div><div class="num">04</div><div class="name">ลูกค้าธุรกิจ</div><div class="file">Business</div></div>
        <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
    </a>
  </nav>
</div>
</body>
</html>
