<!-- 3 Four paths, compact row -->
<section id="hl2-paths" aria-labelledby="hl2-paths-h" style="max-width: 1280px; margin: 0 auto 0 auto; padding: 72px 32px 36px 32px;">
  <h2 id="hl2-paths-h" style="margin: 0 0 24px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 44px; line-height: 1.15;">บ้านแบบไหน ก็มี<b style="font-weight: 700;">สินเชื่อที่ใช่</b></h2>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;">
    <sc-for list="{{paths}}" as="x" hint-placeholder-count="4">
      <article id="{{x.id}}" style="border: 1px solid #E2EAE8; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; margin: 0;">

          <img src="{{x.img}}" alt="{{x.alt}}" style="width: 100%; aspect-ratio: 4 / 2.6; object-fit: cover; object-position: {{x.pos}}; display: block;">
          <span style="position: absolute; left: 14px; bottom: 14px; background: #FFFFFF; border-radius: 12px; padding: 6px 12px; display: flex; gap: 6px; align-items: baseline; box-shadow: 0 6px 16px rgba(0,40,36,0.16);"><span style="font-size: 13px; color: #5A6662;">ปีแรก</span><b style="font-family: 'LH Header', sans-serif; font-size: 24px; color: #049388;">{{x.rate}}</b></span>

            <sc-for list="{{x.hl2}}" as="t" hint-placeholder-count="2">
              <li style="display: flex; gap: 8px; align-items: flex-start; font-size: 16px; color: #3D4845;"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: #00756B; margin-top: 5px;"><path d="M22.32 4.399999999999999 8.48 18.240000000000002Q8.24 18.56 7.800000000000001 18.56Q7.36 18.56 7.12 18.240000000000002L1.76 12.879999999999999Q1.44 12.64 1.04 12.64Q0.64 12.64 0.32 12.879999999999999Q0.0 13.2 0.0 13.6Q0.0 14.0 0.32 14.32L5.68 19.68Q6.5600000000000005 20.56 7.800000000000001 20.56Q9.040000000000001 20.56 9.92 19.68L23.76 5.84Q24.0 5.52 24.0 5.119999999999999Q24.0 4.719999999999999 23.76 4.399999999999999Q23.44 4.16 23.04 4.16Q22.64 4.16 22.32 4.399999999999999Z" style="fill: currentColor; stroke: none;"></path></svg><span>{{t}}</span></li>

            <a href="#" style="font-weight: 700; font-size: 17px;">ดูรายละเอียด</a>

          </div>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<!-- 4 Calculator console -->
<section id="hl2-calc" aria-labelledby="hl2-calc-h" style="max-width: 1280px; margin: 0 auto 0 auto; padding: 36px 32px 36px 32px;">
  <h2 id="hl2-calc-h" style="margin: 0 0 8px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 46px; line-height: 1.15;">รู้ตัวเลข<b style="font-weight: 700;">ก่อนคุยกับธนาคาร</b></h2>
  <p style="margin: 0 0 24px; font-size: 19px; color: #3D4845;">คำนวณจากอัตราดอกเบี้ยจริงของแต่ละสินเชื่อ แล้วส่งตัวเลขให้ผู้เชี่ยวชาญได้ทันที</p>
  <div role="tablist" aria-label="เลือกเครื่องคำนวณ" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #F2F7F6; border-radius: 20px; padding: 6px; margin-bottom: 16px;">
    <sc-for list="{{calcTabs}}" as="ct" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{ct.sel}}" aria-controls="hl2-calc-panel" onClick="{{ct.pick}}" style="cursor: pointer; {{ct.style}}"><span style="{{ct.icBox}}"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="{{ct.d}}" style="fill: currentColor; stroke: none;"></path></svg></span><span>{{ct.label}}</span></button>
    </sc-for>
  </div>
  <div id="hl2-calc-panel" style="border: 1px solid #E2EAE8; border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 440px; box-shadow: 0 16px 40px rgba(0,40,36,0.06);">
    <div role="tabpanel" style="padding: 36px 40px; display: flex; flex-direction: column; gap: 20px;">
      <b style="font-family: 'LH Header', sans-serif; font-size: 28px;">{{k.title}}</b>
      <sc-if value="{{k.hasPick}}" hint-placeholder-val="{{true}}">
        <div><span style="font-size: 17px; color: #5A6662;">สินเชื่อ</span><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"><sc-for list="{{k.picks}}" as="o" hint-placeholder-count="2"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}}">{{o.label}}</button></sc-for></div></div>
      </sc-if>
      <sc-for list="{{k.sliders}}" as="sl" hint-placeholder-count="3">
        <div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px;"><label for="{{sl.id}}" style="color: #3D4845;">{{sl.label}}</label><b style="font-family: 'LH Header', sans-serif; font-size: 22px;">{{sl.txt}}</b></div><input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.val}}" onChange="{{sl.set}}" style="width: 100%; accent-color: #00756B; margin-top: 6px;"><div style="display: flex; justify-content: space-between; font-size: 14px; color: #5A6662;"><span>{{sl.minTxt}}</span><span>{{sl.maxTxt}}</span></div></div>
      </sc-for>
      <span style="font-size: 15px; color: #5A6662;">{{k.note}}</span>
    </div>
    <div aria-live="polite" style="background: linear-gradient(160deg, #2F5C66 0%, #1D3F47 100%); color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; gap: 16px;">
      <span style="font-size: 17px; color: #C5D6D2;">{{k.mainLabel}}</span>
      <b style="font-family: 'LH Header', sans-serif; font-size: 52px; line-height: 1.1; color: #02FECF;">{{k.main}}</b>
      <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 14px;">
        <sc-for list="{{k.subs}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 17px;"><span style="color: #C5D6D2;">{{r.label}}</span><b>{{r.val}}</b></div>
        </sc-for>
      </div>
      <div>
        <span style="font-size: 15px; color: #C5D6D2;">ค่างวด 36 เดือนแรก ไปที่เงินต้นและดอกเบี้ย</span>
        <div aria-hidden="true" style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 8px; background: rgba(255,255,255,0.15);"><span style="{{k.barP}}"></span><span style="{{k.barI}}"></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; margin-top: 6px;"><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #02FECF; margin-right: 6px;"></span>เงินต้น {{k.pTxt}}</span><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #F5C400; margin-right: 6px;"></span>ดอกเบี้ย {{k.iTxt}}</span></div>
      </div>
      <a href="#apply" onClick="{{sendCalc}}" style="margin-top: auto; background: #3AA3CE; color: #FFFFFF; border-radius: 999px; padding: 14px; text-align: center; font-weight: 700; text-decoration: none;">ส่งตัวเลขนี้ให้ผู้เชี่ยวชาญ</a>
    </div>
  </div>
</section>

<!-- 5 Details accordion: rates, steps, documents, eligibility, costs, FAQ -->

        <sc-if value="{{dt.isRates}}" hint-placeholder-val="{{false}}">

            <div role="table" aria-label="อัตราดอกเบี้ยสินเชื่อบ้าน" style="border: 1px solid #E2EAE8; border-radius: 20px; overflow: hidden;">
              <div role="row" style="display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(6, minmax(0, 1fr)); background: #F2F7F6; font-size: 15px; font-weight: 700; color: #3D4845;"><sc-for list="{{rateHead}}" as="h" hint-placeholder-count="7"><span role="columnheader" style="padding: 12px 16px;">{{h}}</span></sc-for></div>
              <sc-for list="{{rateRows}}" as="row" hint-placeholder-count="4">
                <div role="row" style="display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(6, minmax(0, 1fr)); border-top: 1px solid #E2EAE8; align-items: center;"><span role="rowheader" style="padding: 12px 16px; font-weight: 700; font-size: 18px;">{{row.name}}</span><sc-for list="{{row.cells}}" as="cl" hint-placeholder-count="6"><span role="cell" style="{{cl.style}}">{{cl.v}}</span></sc-for></div>

            </div>
            <p style="margin: 10px 0 0; font-size: 14px; color: #5A6662; line-height: 1.6;">MRR = 8.18% (ณ 6 มี.ค. 2569) อัตราลอยตัวเปลี่ยนแปลงได้ · กรณีไม่รับสิทธิ์ฟรีค่าจดจำนอง · EIR คำนวณจากวงเงิน 1 ล้านบาท ผ่อน 30 ปี · รีไฟแนนซ์ปิดบัญชีภายใน 3 ปีแรก มีค่าธรรมเนียม 3% ของเงินต้นคงเหลือ</p>

                <sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 0 0 14px; font-size: 17px; color: #3D4845;">{{q.a}}</p></sc-if>
              </div>
            </sc-for>
          </div>

<!-- 7 NPA search band -->
<section id="hl2-npa" aria-labelledby="hl2-npa-h" style="background: #00463F; color: #FFFFFF; margin: 0 0 0 0;">
  <div style="max-width: 1280px; margin: 0 auto; padding: 64px 32px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.04em; color: #02FECF;">ทรัพย์สินรอการขาย · NPA</span>
      <h2 id="hl2-npa-h" style="margin: 0; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 44px; line-height: 1.15;">บ้านและคอนโด<b style="font-weight: 700;">จากธนาคาร</b></h2>
      <p style="margin: 0; font-size: 19px; color: #C5D6D2;">ค้นหาตามทำเลและงบประมาณ จองออนไลน์ แล้วขอสินเชื่อบ้านต่อได้ในขั้นตอนเดียว</p>
    </div>

<!-- 3 Calculator -->

  <h2 id="hlm-calc-h" style="margin: 0 0 14px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 30px; line-height: 1.2;">รู้ตัวเลข<b style="font-weight: 700;">ก่อนคุยกับธนาคาร</b></h2>
  <div role="tablist" aria-label="เลือกเครื่องคำนวณ" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #F2F7F6; border-radius: 20px; padding: 6px; margin-bottom: 12px;">
    <sc-for list="{{calcTabs}}" as="ct" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{ct.sel}}" onClick="{{ct.pick}}" style="cursor: pointer; {{ct.style}} font-size: 15px; padding: 10px; gap: 8px;"><span style="{{ct.icBox}} width: 32px; height: 32px; border-radius: 12px;"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{ct.d}}" style="fill: currentColor; stroke: none;"></path></svg></span><span>{{ct.label}}</span></button>
    </sc-for>
  </div>
  <div style="border: 1px solid #E2EAE8; border-radius: 20px; overflow: hidden;">
    <div style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">
      <sc-if value="{{k.hasPick}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{k.picks}}" as="o" hint-placeholder-count="2"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}} font-size: 15px; padding: 6px 12px;">{{o.label}}</button></sc-for></div>
      </sc-if>
      <sc-for list="{{k.sliders}}" as="sl" hint-placeholder-count="3">
        <div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 16px;"><label for="{{sl.id}}" style="color: #3D4845;">{{sl.label}}</label><b>{{sl.txt}}</b></div><input id="{{sl.id}}" type="range" min="{{sl.min}}" max="{{sl.max}}" step="{{sl.step}}" value="{{sl.val}}" onChange="{{sl.set}}" style="width: 100%; accent-color: #00756B;"></div>
      </sc-for>
    </div>
    <div aria-live="polite" style="background: linear-gradient(160deg, #2F5C66 0%, #1D3F47 100%); color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; color: #C5D6D2;">{{k.mainLabel}}</span>
      <b style="font-family: 'LH Header', sans-serif; font-size: 36px; line-height: 1.1; color: #02FECF;">{{k.main}}</b>
      <sc-for list="{{k.subs}}" as="r" hint-placeholder-count="2"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px;"><span style="color: #C5D6D2;">{{r.label}}</span><b>{{r.val}}</b></div></sc-for>
      <span style="font-size: 13px; color: #C5D6D2;">{{k.note}}</span>
      <a href="#apply" onClick="{{sendCalc}}" style="background: #3AA3CE; color: #FFFFFF; border-radius: 999px; padding: 12px; text-align: center; font-weight: 700; text-decoration: none;">ส่งตัวเลขนี้ให้ผู้เชี่ยวชาญ</a>
    </div>
  </div>
</section>

<!-- 4 Details accordion -->
<section id="hl2-rates" aria-labelledby="hlm-det-h" style="padding: 20px 16px 40px 16px; margin: 0 0 0 0;">
  <h2 id="hlm-det-h" style="margin: 0 0 14px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 30px; line-height: 1.2;">รายละเอียด<b style="font-weight: 700;">และเงื่อนไข</b></h2>
  <div style="border: 1px solid #E2EAE8; border-radius: 20px; overflow: hidden;">
    <sc-for list="{{det}}" as="dt" hint-placeholder-count="6">
      <div id="{{dt.id}}" style="border-top: 1px solid #E2EAE8;">
        <button aria-expanded="{{dt.open}}" onClick="{{dt.toggle}}" style="width: 100%; border: 0; background: {{dt.bg}}; padding: 14px 16px; display: flex; gap: 12px; align-items: center; text-align: left; font-size: 17px; font-weight: 700; color: #1F2224; min-height: 56px;"><span style="width: 34px; height: 34px; border-radius: 12px; background: #E0F4F1; color: #00756B; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{dt.d}}" style="fill: currentColor; stroke: none;"></path></svg></span><span style="flex: 1;">{{dt.t}}</span><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="{{dt.chev}}"><path d="M18.72 8.24Q18.400000000000002 7.919999999999998 18.0 7.919999999999998Q17.6 7.919999999999998 17.28 8.24L12.72 12.799999999999999Q12.4 13.12 12.0 13.12Q11.6 13.12 11.28 12.799999999999999L6.72 8.24Q6.4 7.919999999999998 6.0 7.919999999999998Q5.6000000000000005 7.919999999999998 5.28 8.2Q4.96 8.48 4.96 8.92Q4.96 9.36 5.28 9.6L9.92 14.24Q10.72 15.12 12.0 15.12Q13.280000000000001 15.12 14.16 14.24L18.72 9.6Q19.04 9.36 19.04 8.92Q19.04 8.48 18.72 8.24Z" style="fill: currentColor; stroke: none;"></path></svg></button>
        <sc-if value="{{dt.isRates}}" hint-placeholder-val="{{false}}">
          <div style="padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
            <div role="group" aria-label="เงื่อนไขประกัน" style="display: flex; gap: 4px; background: #E3F2EF; border-radius: 999px; padding: 4px;"><sc-for list="{{mrta}}" as="m" hint-placeholder-count="2"><button aria-pressed="{{m.sel}}" onClick="{{m.pick}}" style="cursor: pointer; flex: 1; {{m.style}} font-size: 14px; padding: 8px 6px;">{{m.label}}</button></sc-for></div>
            <sc-for list="{{rateCards}}" as="rc" hint-placeholder-count="4">
              <div style="background: #F7FBFA; border-radius: 12px; padding: 12px 14px;">
                <b style="font-size: 16px;">{{rc.name}}</b>
                <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px;"><span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5A6662;">ปีที่ 1</span><b style="font-family: 'LH Header', sans-serif; font-size: 20px; color: #049388;">{{rc.y1}}</b></span><span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5A6662;">เฉลี่ย 3 ปี</span><b style="font-family: 'LH Header', sans-serif; font-size: 20px;">{{rc.avg}}</b></span><span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5A6662;">EIR</span><b style="font-family: 'LH Header', sans-serif; font-size: 20px;">{{rc.eir}}</b></span></div>
                <span style="font-size: 13px; color: #5A6662;">ปีที่ 2–3: {{rc.y23}} · หลังจากนั้น {{rc.after}}</span>
              </div>
            </sc-for>
            <p style="margin: 0; font-size: 12px; color: #5A6662; line-height: 1.5;">% ต่อปี ประกาศ ณ 1 พ.ย. 2569 · MRR = 8.18% · กรณีไม่รับสิทธิ์ฟรีค่าจดจำนอง · รีไฟแนนซ์ปิดบัญชีภายใน 3 ปีแรก มีค่าธรรมเนียม 3%</p>
          </div>
        </sc-if>
        <sc-if value="{{dt.isSteps}}" hint-placeholder-val="{{false}}">
          <ol style="margin: 0; padding: 2px 16px 16px; list-style: none; display: flex; flex-direction: column; gap: 10px;"><sc-for list="{{journey}}" as="st" hint-placeholder-count="5"><li style="display: flex; gap: 12px; align-items: flex-start;"><span style="width: 28px; height: 28px; border-radius: 999px; background: #00756B; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{st.n}}</span><span style="display: flex; flex-direction: column; line-height: 1.4;"><b style="font-size: 16px;">{{st.t}}</b><span style="font-size: 14px; color: #3D4845;">{{st.s}}</span></span></li></sc-for></ol>
        </sc-if>
        <sc-if value="{{dt.isDocs}}" hint-placeholder-val="{{false}}">
          <div style="padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{jobs}}" as="o" hint-placeholder-count="3"><button aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}} font-size: 14px; padding: 6px 12px; min-height: 36px;">{{o.label}}</button></sc-for></div>
            <sc-for list="{{docCols}}" as="d" hint-placeholder-count="3"><div><b style="font-size: 16px;">{{d.t}}</b><ul style="margin: 4px 0 0; padding-left: 20px; font-size: 15px; color: #3D4845;"><sc-for list="{{d.items}}" as="t" hint-placeholder-count="3"><li>{{t}}</li></sc-for></ul></div></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{dt.isList}}" hint-placeholder-val="{{false}}">
          <ul style="margin: 0; padding: 2px 16px 16px 38px; font-size: 15px; color: #3D4845; display: flex; flex-direction: column; gap: 4px;"><sc-for list="{{dt.items}}" as="t" hint-placeholder-count="4"><li>{{t}}</li></sc-for></ul>
        </sc-if>
        <sc-if value="{{dt.isFaq}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 16px 10px;"><sc-for list="{{faqs}}" as="q" hint-placeholder-count="4"><div style="border-top: 1px solid #E2EAE8;"><button aria-expanded="{{q.open}}" onClick="{{q.toggle}}" style="width: 100%; border: 0; background: transparent; padding: 12px 0; display: flex; justify-content: space-between; gap: 10px; text-align: left; font-size: 16px; font-weight: 700; color: #1F2224;"><span>{{q.q}}</span><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="{{q.chev}}"><path d="M18.72 8.24Q18.400000000000002 7.919999999999998 18.0 7.919999999999998Q17.6 7.919999999999998 17.28 8.24L12.72 12.799999999999999Q12.4 13.12 12.0 13.12Q11.6 13.12 11.28 12.799999999999999L6.72 8.24Q6.4 7.919999999999998 6.0 7.919999999999998Q5.6000000000000005 7.919999999999998 5.28 8.2Q4.96 8.48 4.96 8.92Q4.96 9.36 5.28 9.6L9.92 14.24Q10.72 15.12 12.0 15.12Q13.280000000000001 15.12 14.16 14.24L18.72 9.6Q19.04 9.36 19.04 8.92Q19.04 8.48 18.72 8.24Z" style="fill: currentColor; stroke: none;"></path></svg></button><sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 0 0 12px; font-size: 15px; color: #3D4845;">{{q.a}}</p></sc-if></div></sc-for></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</section>

<!-- 5 NPA search (v2 style) -->
<section id="hl2-npa" aria-labelledby="hlm-npa-h" style="background: #00463F; color: #FFFFFF; padding: 32px 16px; margin: 0 0 0 0;">
  <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #02FECF;">ทรัพย์สินรอการขาย · NPA</span>
  <h2 id="hlm-npa-h" style="margin: 6px 0 6px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 30px; line-height: 1.2;">บ้านและคอนโด<b style="font-weight: 700;">จากธนาคาร</b></h2>
  <p style="margin: 0 0 16px; font-size: 16px; color: #C5D6D2;">ค้นหาตามทำเลและงบประมาณ จองออนไลน์ แล้วขอสินเชื่อบ้านต่อได้ในขั้นตอนเดียว</p>
  <form role="search" aria-label="ค้นหาทรัพย์สินรอการขาย" onSubmit="{{npaSearch}}" style="background: #FFFFFF; color: #1F2224; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #5A6662;">ทำเล<select style="font: inherit; font-size: 17px; color: #1F2224; padding: 11px 12px; border: 1.5px solid #C5D6D2; border-radius: 12px; background: #FFFFFF;"><option>ทุกทำเล</option><option>กรุงเทพมหานคร</option><option>นนทบุรี</option><option>ปทุมธานี</option><option>สมุทรปราการ</option></select></label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #5A6662;">งบประมาณ<select style="font: inherit; font-size: 17px; color: #1F2224; padding: 11px 12px; border: 1.5px solid #C5D6D2; border-radius: 12px; background: #FFFFFF;"><option>ทุกช่วงราคา</option><option>ไม่เกิน 3 ล้านบาท</option><option>3–5 ล้านบาท</option><option>5–10 ล้านบาท</option><option>มากกว่า 10 ล้านบาท</option></select></label>
    <div><span style="font-size: 15px; color: #5A6662;">ประเภท</span><div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;"><sc-for list="{{npaTypes}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}} font-size: 14px; padding: 6px 12px; min-height: 36px;">{{o.label}}</button></sc-for></div></div>
    <button type="submit" style="border: 0; background: #3AA3CE; color: #FFFFFF; border-radius: 999px; padding: 13px; font-size: 17px; font-weight: 700;">ค้นหาทรัพย์</button>
    <a href="#" style="text-align: center; font-weight: 700; font-size: 15px;">จอง NPA ออนไลน์ ทำอย่างไร</a>
  </form>
</section>

<!-- 6 FAQ + guides (v2 style) -->
<section id="hl2-faq" aria-labelledby="hlm-faq-h" style="padding: 40px 16px 40px 16px; margin: 0 0 0 0;">
  <h2 id="hlm-faq-h" style="margin: 0 0 12px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 30px; line-height: 1.2;">คำถาม<b style="font-weight: 700;">ที่พบบ่อย</b></h2>
  <div style="border-top: 1px solid #E2EAE8;">
    <sc-for list="{{faqs}}" as="q" hint-placeholder-count="5">
      <div style="border-bottom: 1px solid #E2EAE8;"><button aria-expanded="{{q.open}}" onClick="{{q.toggle}}" style="width: 100%; border: 0; background: transparent; padding: 14px 2px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; font-size: 17px; font-weight: 700; color: #1F2224;"><span>{{q.q}}</span><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="{{q.chev}}"><path d="M18.72 8.24Q18.400000000000002 7.919999999999998 18.0 7.919999999999998Q17.6 7.919999999999998 17.28 8.24L12.72 12.799999999999999Q12.4 13.12 12.0 13.12Q11.6 13.12 11.28 12.799999999999999L6.72 8.24Q6.4 7.919999999999998 6.0 7.919999999999998Q5.6000000000000005 7.919999999999998 5.28 8.2Q4.96 8.48 4.96 8.92Q4.96 9.36 5.28 9.6L9.92 14.24Q10.72 15.12 12.0 15.12Q13.280000000000001 15.12 14.16 14.24L18.72 9.6Q19.04 9.36 19.04 8.92Q19.04 8.48 18.72 8.24Z" style="fill: currentColor; stroke: none;"></path></svg></button><sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 0 2px 14px; font-size: 15px; color: #3D4845;">{{q.a}}</p></sc-if></div>
    </sc-for>
  </div>
  <h3 style="margin: 28px 0 8px; font-family: 'LH Header', sans-serif; font-size: 22px;">อ่านก่อนตัดสินใจกู้</h3>
  <ol style="margin: 0; padding: 0; list-style: none;">
    <sc-for list="{{guides}}" as="g" hint-placeholder-count="5">
      <li style="border-top: 1px solid #E2EAE8;"><a href="#" style="display: flex; gap: 14px; padding: 12px 0; color: #1F2224; text-decoration: none;"><span style="font-family: 'LH Header', sans-serif; font-size: 22px; font-weight: 700; color: #9FCFC7; min-width: 30px;">{{g.n}}</span><span style="display: flex; flex-direction: column; line-height: 1.4;"><b style="font-size: 16px;">{{g.t}}</b><span style="font-size: 14px; color: #5A6662;">{{g.s}}</span></span></a></li>
    </sc-for>
  </ol>
</section>

<!-- 6 Lead form -->
<section id="apply" aria-labelledby="hlm-apply-h" style="background: linear-gradient(180deg, #EEF6F4 0%, #E0F4F1 100%); padding: 32px 16px; margin: 0 0 0 0;">
  <h2 id="hlm-apply-h" style="margin: 0 0 6px; font-family: 'LH Header', sans-serif; font-weight: 200; font-size: 30px; line-height: 1.2;">ให้ผู้เชี่ยวชาญ<b style="font-weight: 700; color: #00756B;">ติดต่อกลับ</b></h2>
  <p style="margin: 0 0 16px; font-size: 16px; color: #3D4845;">ใช้เวลาไม่ถึง 2 นาที ไม่ต้องแนบเอกสารตอนนี้</p>
  <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center;"><b style="font-family: 'LH Header', sans-serif; font-size: 22px;">{{lf.title}}</b><span style="font-size: 14px; color: #5A6662;">{{lf.stepTxt}}</span></div>
    <div aria-hidden="true" style="display: flex; gap: 6px;"><span style="flex: 1; height: 5px; border-radius: 3px; background: #00756B;"></span><span style="{{lf.bar2}}"></span></div>
    <sc-if value="{{lf.s1}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div><span style="font-size: 15px; color: #5A6662;">อยากทำเรื่อง</span><div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;"><sc-for list="{{lfPaths}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}} font-size: 14px; padding: 6px 12px;">{{o.label}}</button></sc-for></div></div>
        <div><span style="font-size: 15px; color: #5A6662;">อาชีพ</span><div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;"><sc-for list="{{jobs}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.sel}}" onClick="{{o.pick}}" style="cursor: pointer; {{o.style}} font-size: 14px; padding: 6px 12px;">{{o.label}}</button></sc-for></div></div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #5A6662;">วงเงินที่ต้องการ (บาท)<input type="text" inputmode="numeric" value="{{lf.amtTxt}}" style="font: inherit; font-size: 17px; color: #1F2224; padding: 11px 12px; border: 1.5px solid #C5D6D2; border-radius: 12px;"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #5A6662;">จังหวัดที่ตั้งหลักประกัน<select style="font: inherit; font-size: 17px; color: #1F2224; padding: 11px 12px; border: 1.5px solid #C5D6D2; border-radius: 12px; background: #FFFFFF;"><option>กรุงเทพมหานคร</option><option>นนทบุรี</option><option>ปทุมธานี</option><option>สมุทรปราการ</option><option>จังหวัดอื่น</option></select></label>
        <sc-if value="{{lf.hasCalc}}" hint-placeholder-val="{{false}}"><div style="background: #E0F4F1; border-radius: 12px; padding: 10px 12px; font-size: 15px; color: #00463F;">แนบตัวเลข: {{lf.calcTxt}}</div></sc-if>
        <button type="button" onClick="{{lfNext}}" style="border: 0; background: #3AA3CE; color: #FFFFFF; border-radius: 999px; padding: 13px; font-size: 17px; font-weight: 700;">ถัดไป</button>
      </div>
    </sc-if>
    <sc-if value="{{lf.s2}}" hint-placeholder-val="{{false}}">
      <form onSubmit="{{lfSubmit}}" novalidate style="display: flex; flex-direction: column; gap: 12px;">
        <div style="background: #F2F7F6; border-radius: 12px; padding: 10px 12px; font-size: 15px;">สนใจ <b>{{lf.pathTxt}}</b> · วงเงิน {{lf.amtTxt}} บาท <button type="button" onClick="{{lfBack}}" style="border: 0; background: none; padding: 0 0 0 4px; color: #00756B; font-weight: 700; text-decoration: underline; font-size: 14px;">แก้ไข</button></div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #5A6662;">ชื่อ-นามสกุล<input type="text" autocomplete="name" style="font: inherit; font-size: 17px; color: #1F2224; padding: 11px 12px; border: 1.5px solid #C5D6D2; border-radius: 12px;"></label>
